[package]
name = "mutiny"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Pure Rust + GTK4 Linux desktop terminal with pane mobility and IPC parity"
license = "MIT OR Apache-2.0"

[dependencies]
alacritty_terminal = "0.26.0"
clap = { version = "4.6.8", features = ["derive"] }
gtk4 = { version = "0.11.5", features = ["v4_22"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
