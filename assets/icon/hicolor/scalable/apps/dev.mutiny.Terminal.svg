<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mutiny application icon.

  Motif: a Jolly Roger skull whose eye sockets are square terminal cells and
  whose mouth is a cursor bar. Pirate first, terminal second, so it still reads
  as a skull at 16 px.

  Style follows the Haven sibling icon: flat white silhouette on deep navy
  (#1A1A2E), plain geometric fills, no gradients, strokes, or filters. Keeping
  to basic shapes also means any SVG renderer produces the same pixels.

  Grid is 128 so every coordinate divides cleanly down to 16 (divide by 8).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Plate. Rounded for the Linux hicolor convention; Haven ships full-bleed
       because Android masks it. Same colour and weight either way. -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#1A1A2E"/>

  <!-- Skull silhouette: cranium and jaw overlap so they read as one shape. -->
  <rect x="30" y="28" width="68" height="58" rx="26" fill="#FFFFFF"/>
  <rect x="44" y="74" width="40" height="32" rx="10" fill="#FFFFFF"/>

  <!-- Eye sockets: square cells, the terminal reference. Large enough to
       survive 16 px, where each is about two pixels. -->
  <rect x="42" y="48" width="18" height="20" rx="4" fill="#1A1A2E"/>
  <rect x="68" y="48" width="18" height="20" rx="4" fill="#1A1A2E"/>

  <!-- Nose. Small, but it is what stops the skull reading as a robot. -->
  <path d="M64 70 L70 80 L58 80 Z" fill="#1A1A2E"/>

  <!-- Mouth as a cursor bar, with two tooth gaps below it. -->
  <rect x="48" y="86" width="32" height="5" rx="2" fill="#1A1A2E"/>
  <rect x="58" y="91" width="4" height="9" fill="#1A1A2E"/>
  <rect x="66" y="91" width="4" height="9" fill="#1A1A2E"/>
</svg>