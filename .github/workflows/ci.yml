name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reusable so the release workflow can gate on the same checks.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    # A hung test must fail fast with logs, not burn the 6-hour default.
    timeout-minutes: 20
    # The crate needs GTK 4.22+. Ubuntu runners ship an older GTK, so build in
    # Arch, which carries gtk4 4.24. base-devel does NOT include git, so it is
    # installed explicitly before checkout. zstd is needed by actions/cache.
    container:
      image: archlinux:base-devel
    steps:
      - name: Install GTK 4.22+, Rust, git, Xvfb
        run: |
          set -eu
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed git gtk4 rustup xorg-server-xvfb zstd fish tmux noto-fonts noto-fonts-cjk noto-fonts-emoji ttf-dejavu
          rustup default stable
          rustup component add clippy rustfmt

      - name: Assert fish is installed
        run: |
          set -eu
          # The fish startup test skips when fish is absent. Without this
          # assertion a failed install would report green without running it.
          fish --version

      - name: Assert tmux is installed
        run: |
          set -eu
          # The session-discovery tests skip when tmux is absent. Without this
          # assertion a failed install would report green without running them.
          tmux -V

      - name: Require GTK 4.22 or newer
        run: |
          set -eu
          ver=$(pkg-config --modversion gtk4)
          echo "gtk4 $ver"
          if [ "$(printf '%s\n' 4.22 "$ver" | sort -V | head -1)" != "4.22" ]; then
            echo "::error::gtk4 $ver is older than the required 4.22"
            exit 1
          fi

      - uses: actions/checkout@v7

      # The cache key carries the toolchain and GTK versions because the Arch
      # image floats: a new rustc or GTK invalidates compiled -sys crates even
      # when Cargo.lock is unchanged.
      - name: Record toolchain and GTK versions
        id: versions
        run: |
          set -eu
          echo "rustc=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "gtk4=$(pkg-config --modversion gtk4)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ github.job }}-${{ steps.versions.outputs.rustc }}-gtk${{ steps.versions.outputs.gtk4 }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ github.job }}-${{ steps.versions.outputs.rustc }}-gtk${{ steps.versions.outputs.gtk4 }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Must pass with no display at all: this is the property that lets
      # engine, topology, IPC, and MCP work be tested without a desktop.
      # Single-threaded: the suite spawns real PTYs, and alacritty registers a
      # process-global SIGCHLD hook per Pty and blocks in child.wait() on drop.
      # Running tests in parallel threads contends on that and can hang. The
      # suite is a few seconds, so serialization costs nothing.
      - name: Tests (no display)
        run: timeout 600 cargo test --locked -- --test-threads=1 --nocapture
        env:
          WAYLAND_DISPLAY: ""
          DISPLAY: ""

      # Under Xvfb the GTK-dependent assertions actually run, including the
      # accelerator-syntax check a displayless run silently skips.
      - name: Tests (virtual display)
        run: timeout 600 xvfb-run -a cargo test --locked -- --test-threads=1 --nocapture

      - name: Baseline benchmark builds
        run: cargo bench --locked --no-run

  build:
    name: release build
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install GTK 4.22+, Rust, git
        run: |
          set -eu
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed git gtk4 rustup zstd
          rustup default stable

      - uses: actions/checkout@v7

      - name: Record toolchain and GTK versions
        id: versions
        run: |
          set -eu
          echo "rustc=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "gtk4=$(pkg-config --modversion gtk4)" >> "$GITHUB_OUTPUT"

      # Separate key from the check job: this one builds the release profile,
      # so sharing a target directory would make the two jobs evict each other.
      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ github.job }}-${{ steps.versions.outputs.rustc }}-gtk${{ steps.versions.outputs.gtk4 }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ github.job }}-${{ steps.versions.outputs.rustc }}-gtk${{ steps.versions.outputs.gtk4 }}-

      - name: Build release binary
        run: cargo build --locked --release

      - name: Smoke test the built CLI
        run: |
          set -eu
          ./target/release/mutiny --version
          ./target/release/mutiny ctl --help
          ./target/release/mutiny mcp --help

      - uses: actions/upload-artifact@v7
        with:
          name: mutiny-linux-x86_64
          path: target/release/mutiny
          if-no-files-found: error
          retention-days: 14
